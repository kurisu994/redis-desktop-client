name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "*.lock"
      - "LICENSE"
      - ".gstack/**"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: AppImage metadata regression tests
        run: node --test scripts/check-appimage.test.mjs

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all-features

  build:
    name: Build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Match the oldest supported Linux runtime (glibc 2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 在普通的 CI 流水线中，临时禁用 Updater 包生成，避免因为找不到私钥而构建失败
          args: >-
            --target ${{ matrix.target }} --config '{"bundle": {"createUpdaterArtifacts": false}}'

      - name: Check AppImage metadata (Linux)
        if: runner.os == 'Linux'
        run: node scripts/check-appimage.mjs src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Install AppImage smoke test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xdotool imagemagick dbus-x11 locales fonts-noto-cjk
          sudo locale-gen en_US.UTF-8 de_DE.UTF-8 zh_CN.UTF-8

      - name: Smoke test AppImage on Ubuntu 22.04
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- \
            bash scripts/smoke-appimage.sh \
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            "$RUNNER_TEMP/appimage-smoke"

      - name: Upload AppImage startup logs and screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-smoke-ubuntu-22.04
          path: ${{ runner.temp }}/appimage-smoke
          if-no-files-found: ignore
          retention-days: 14
